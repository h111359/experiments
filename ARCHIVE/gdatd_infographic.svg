<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="GDATD team infographic">
  <metadata>
    GDATD infographic (Jan 2026). Icon-first layout, minimal text.
    NOTE: SVGRepo icons cannot be embedded automatically from this environment because svgrepo.com is returning HTTP 429 (Too Many Requests).
    If you provide SVGRepo icon URLs/IDs (or paste the full SVG snippets), placeholders can be replaced 1:1 while keeping the no-transform rule.
  </metadata>

  <defs>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #0f1b34;
        --panel2: #101f3d;
        --stroke: rgba(255,255,255,0.14);
        --text: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.72);
        --faint: rgba(255,255,255,0.58);
        --accent: #60a5fa;
        --accent2: #34d399;
        --accent3: #f59e0b;
        --danger: #fb7185;
      }

      .bg { fill: var(--bg); }
      .title { font: 700 36px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--text); letter-spacing: 0.2px; }
      .subtitle { font: 500 16px/1.3 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--muted); }
      .kpi { font: 700 22px/1.1 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--text); }
      .kpiLabel { font: 500 12px/1.3 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--faint); letter-spacing: 0.3px; }
      .h { font: 700 14px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--text); letter-spacing: 0.4px; }
      .t { font: 500 12px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--muted); }
      .tiny { font: 500 11px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: var(--faint); }

      .panel { fill: var(--panel); stroke: var(--stroke); stroke-width: 1; }
      .panel2 { fill: var(--panel2); stroke: var(--stroke); stroke-width: 1; }
      .chip { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.10); stroke-width: 1; }

      .iconStroke { fill: none; stroke: rgba(255,255,255,0.86); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .iconFill { fill: rgba(255,255,255,0.86); }
      .accentFill { fill: rgba(96,165,250,0.95); }
      .accentStroke { stroke: rgba(96,165,250,0.95); }
      .good { fill: rgba(52,211,153,0.95); }
      .warn { fill: rgba(245,158,11,0.95); }
      .bad { fill: rgba(251,113,133,0.95); }

      .divider { stroke: rgba(255,255,255,0.10); stroke-width: 1; }
      .arrow { stroke: rgba(255,255,255,0.35); stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
    </style>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.12"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
